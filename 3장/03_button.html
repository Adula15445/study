<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value = "버튼">
    <button type = "button">버튼</button><br>
    <!-- 
        단순 버튼, 아무 기능이 없는 버튼이다.
    -->
    <input type="submit" value = "전송">
    <button type = "submit">전송</button> <br>
    <!-- 
        클릭하면 브라우저가 폼 데이터를 웹 서버로 전송한다.
    -->
    <input type="reset" value="리셋">
    <button type = "reset">리셋</button> <br>
    <!-- 
        폼에 입력된 내용을 모두 지우고 초기화한다.
    -->
    <input type="image" src="/media/button.png">
    <button type="button" ><img src="/media/button.png" alt="이미지 버튼"></button>
    <!-- 
        이미지가 있는 버튼이다.
    -->

</body>
</html>
