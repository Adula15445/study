<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        label 태그를 사용하면 캡션과 폼 요소를 한 단위로 묶어 
        문서를 훨씬 명료하게 표현할 수 있고, 한 다위로 다룰 수
        있어 많은 장점을 가진다.
    -->
        <label>
            사용자 ID : <input type="text">
        </label><br>

        <label for="passowrd">비밀번호 :</label>
        <input type="password"> <br>

        <!-- 
            선택형 요소를 label로 감싸면 문자열이나 이미지를 눌러도 선택되도록 할 수 있다.
        -->
        <label>
        <input type="checkbox"> 고양이 <img src="/media/mio.png" height="40">
        </label>


</body>
</html>
