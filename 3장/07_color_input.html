<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1>색 표시</h1>
        색 선택 : <input type="color" onchange="document.body.style.color = this.value">
    </form>
    <!-- 
        type = "color" : 컬러 다이얼로그로 색을 입력받을 수 있다.
        value = "#000000" : 초기 색을 지정한다.
    -->
</body>
</html>
