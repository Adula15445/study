<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    <fieldset>
        <legend>도형 서식 입력</legend>
        <label for="">
        선종류    
        <select size = "3">
            <option value="1">선없음</option>
            <option value="2">실선</option>
            <option value="3">점선</option>
        </select>
        </label> <br> <br>

        <label for="">
            선두께 <input type="text">
        </label>
        
        <label for="">
            선 색 <input type="color" value="#00ffff">
        </label> <br> <br>

        <label for="">
            투명도(0~100) : <input type="range" min="0" max="100" list="i">
            <datalist id = i>
                <option value="0"></option>
                <option value="50"></option>
                <option value="100"></option>
            </datalist>
        </label>
        
    </fieldset>
</body>
</html>
