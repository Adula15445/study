<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        이름 : <input type="text" value = "제라오라" maxlength="4" size = "6"> <br>
        비밀번호 : <input type="password" value = "password"> <br>
        <!-- 
            type = "text|password"
            text : 한 줄 텍스트를 입력받는다.
            password ; 암호를 입력받는다
            name = "요소 이름"
            maxlength = "문자 개수" : 입력할 수 있는 문자의 최대 개수
            size = "문자 개수" : 입력 창의 크기, 단위는 문자의 개수
        -->
        자기소개 : <textarea cols = "20" rows = "5" warp = "">자기소개를 적어주세요.</textarea>
        <!--  
            cols = "열 개수"
            rows = "행 개수" 
            텍스트 입력창의 크기. 가로세로 문자 수.
            name = "요소 이름"
            태그 안의 문자가 초기 출력될 텍스트다.
        -->
        
    </form>
</body>
</html>
