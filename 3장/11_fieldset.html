<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
        <legend>회원정보를 입력하세요</legend>
        이메일 주소 : <input type="email" placeholder="abcd@efg"> <br>
        서버 주소 : <input type="url" placeholder="http://"> <br>
        전화번호 : <input type="tel" placeholder="010-1234-5678"> <br>
        전송 : <input type="submit" value="전송"><br>
        검색어 : <input type="search" placeholder="검색어">
        <input type="submit" value = "검색">
        </fieldset>
        <!-- 
            fieldset 태그로 폼 요소들을 그룹으로 묶을 수 있으며, 그룹의
            제목은 legend 태그로 표현한다. 
        -->
    </form>
</body>
</html>
