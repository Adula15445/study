<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        포켓몬 : <input type="text" list="pokemon"> <br>
        <datalist id = "pokemon"> 
            <option value="제라오라"></option>
            <option value="루카리오"></option>
        </datalist>
        <!-- 
            input 태그의 list 속성 값과 datalist의 id속성 값을
            동일하게 하여 이 둘을 연결한다.
            option 태그는 데이터 항목 하나를 나타낸다.
        -->
    </form>
</body>
</html>
