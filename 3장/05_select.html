<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <select name="pokemon" size = "1">
            <option value="1" selected>제라오라</option>
            <option value="2">루카리오</option>
            <option value="3">에이스번</option>
        </select>
        <!--  
            name = "요소 이름"
            size = "개수" : 콤보박스 창 크기
            multiple : 다수 항목 선택 가능
            datalist와 select의 차이점 : datalist를 사용하면 옵션 리스트에서 선택하거나
            입력창에 직접 입력하여 항목을 선택할 수 있지만, select의 경우 옵션리스트에서만
            선택할 수 있다.
        -->

    </form>
</body>
</html>
