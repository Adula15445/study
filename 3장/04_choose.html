<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        
        제라오라  <input type="checkbox" value = "1" checked> <br>
        루카리오 <input type="checkbox" value="2"><br>
        에이스번 <input type="checkbox" value="3"> <br>
        <input type="radio" name = "pokemon" value = "1" checked> 제라오라 <br>
        <input type="radio" name = "pokemon" value = "2"> 루카리오 <br>
        <input type="radio" name = "pokemon" value = "3"> 에이스번 <br>
        <!-- 
            type = "checkbox|radio"
            name = "요소 이름"
            value = "요소 값" ; 폼 요소가 선택 될 때 웹 서버에 전송되는 값
            checked : 초기에 선택 상태로 출력
            checkbox는 원하는 만큼 선택 가능한 반면,
            radio는 같은 name을 가진 버튼 중 하나만 선택 가능하다.
        -->

    </form>
</body>
</html>
